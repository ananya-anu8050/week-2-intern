<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive Image Gallery</h1>
    <p class="subtitle">Click on an image to view it larger</p>

    <div class="gallery">

        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
             alt="Nature"
             onclick="openLightbox(this.src, this.alt)">

        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
             alt="Mountain"
             onclick="openLightbox(this.src, this.alt)">

        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
             alt="Beach"
             onclick="openLightbox(this.src, this.alt)">

        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
             alt="Forest"
             onclick="openLightbox(this.src, this.alt)">

        <img src="https://images.unsplash.com/photo-1511497584788-876760111969"
             alt="Trees"
             onclick="openLightbox(this.src, this.alt)">

        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e"
             alt="Landscape"
             onclick="openLightbox(this.src, this.alt)">

        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
             alt="Road"
             onclick="openLightbox(this.src, this.alt)">

        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
             alt="Mountain Landscape"
             onclick="openLightbox(this.src, this.alt)">

    </div>


    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">

        <span class="close">&times;</span>

        <img id="lightboxImage" src="" alt="">

    </div>


    <script src="script.js"></script>

</body>
</html>
